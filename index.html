<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de Produtos | JA Saúde Animal</title>
  <meta name="description" content="Catálogo de produtos da JA Saúde Animal. Encontre o produto e baixe o folheto técnico.">
  <meta name="theme-color" content="#0a4a2e">
  <link rel="icon" type="image/png" href="img/logo/logo-ja.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
  <section class="banner" aria-label="Destaque">
    <div class="banner__vazio" aria-hidden="true">
      <span>Espaço do banner</span>
      <small>1920 × 200 px &nbsp;|&nbsp; celular 800 × 400 px</small>
    </div>
    <picture>
      <source media="(max-width: 639px)" srcset="img/banner/banner-mobile.jpg">
      <img id="bannerImg" src="img/banner/banner.jpg" alt="JA Saúde Animal">
    </picture>
  </section>

  <div class="container layout" id="layout">

    <aside class="menu">
      <label class="busca">
        <span class="sr-only">Buscar produto</span>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" id="busca" placeholder="Buscar produto" autocomplete="off">
      </label>

      <button type="button" class="menu__abrir" id="abrirMenu" aria-expanded="false" aria-controls="categorias">
        <span>Categoria: <strong id="catAtual">Todos</strong></span>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <p class="menu__titulo">Categorias</p>
      <nav class="menu__lista" id="categorias" aria-label="Categorias"></nav>
    </aside>

    <main class="principal">
      <div class="intro">
        <h1>Catálogo de produtos</h1>
        <p>Escolha o produto e toque nele para baixar o folheto técnico.</p>
      </div>
      <div id="catalogo" aria-live="polite"></div>
    </main>

  </div>

  <footer class="rodape">
    <div class="container rodape__conteudo">
      <img src="img/logo/logo-ja-horizontal.png" alt="JA Saúde Animal" width="900" height="153" class="rodape__logo">

      <ul class="redes" aria-label="Redes sociais da JA Saúde Animal">
        <li>
          <a href="https://www.instagram.com/jasaudeanimal/" target="_blank" rel="noopener" aria-label="Instagram">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.2" cy="6.8" r="1.2" fill="currentColor"/></svg>
          </a>
        </li>
        <li>
          <a href="https://www.facebook.com/jasaudeanimal/" target="_blank" rel="noopener" aria-label="Facebook">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 21v-7.5H16l.5-3h-3V8.7c0-.9.3-1.5 1.6-1.5h1.5V4.5c-.3 0-1.2-.1-2.2-.1-2.3 0-3.9 1.4-3.9 4v2.1H8v3h2.5V21h3z" fill="currentColor"/></svg>
          </a>
        </li>
        <li>
          <a href="https://www.youtube.com/c/JASaudeAnimaloficial" target="_blank" rel="noopener" aria-label="YouTube">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>
          </a>
        </li>
        <li>
          <a href="https://www.linkedin.com/company/jasaudeanimal/" target="_blank" rel="noopener" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="9.5" width="3.2" height="10" fill="currentColor"/><circle cx="5.6" cy="5.8" r="1.9" fill="currentColor"/><path d="M10 9.5h3v1.4c.5-.9 1.6-1.7 3.2-1.7 3 0 3.8 2 3.8 4.6v5.7h-3.2v-5c0-1.3-.1-2.7-1.7-2.7s-1.9 1.3-1.9 2.6v5.1H10z" fill="currentColor"/></svg>
          </a>
        </li>
      </ul>

      <p class="rodape__contato">
        <span>Central de Atendimento: <a href="tel:08007744334">0800 774 4334</a> / <a href="tel:+551631459920">(16) 3145-9920</a></span>
        <a href="https://www.jasaudeanimal.com.br" target="_blank" rel="noopener">jasaudeanimal.com.br</a>
      </p>
      <p class="rodape__copy">© <span id="ano"></span> JA Saúde Animal. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script src="data/produtos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
